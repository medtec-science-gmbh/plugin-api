name: Publish package to the Maven Central Repository

on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Configure GPG Key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$GPG_SIGNING_KEY" || { echo "GPG_SIGNING_KEY is empty or unavailable"; exit 1; }
          printf '%s' "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys | grep -q '^sec:' \
            || { echo "No private GPG key was imported"; exit 1; }
          gpg --list-secret-keys --keyid-format LONG \
            --with-fingerprint --with-subkey-fingerprint
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Publish package
        run: mvn clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
